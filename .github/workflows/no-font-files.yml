# KOTOR_RPG_HANDOFF is public and text only. Fail any push or PR that carries an image, video, font, texture or .2da
# (owner ruling 2026-10-11: all media goes private). The list lives in .githooks/forbidden.sh,
# shared with the pre-commit hook, and the guard is tested first so a broken guard cannot pass silently.
name: no-font-files
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The guard's own test
        run: sh .githooks/test-forbidden.sh
      - name: Reject forbidden files
        run: |
          bad=$(git ls-files | sh .githooks/forbidden.sh || true)
          if [ -n "$bad" ]; then
            echo "Images, videos, fonts, textures and .2da files are not allowed in this public repo:"; echo "$bad"; exit 1
          fi
